services:
  mysql:
    image: mysql:8.4
    container_name: finsight-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finsight
      MYSQL_USER: finsight
      MYSQL_PASSWORD: finsight1234
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - finsight-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  finsight-mysql-data: